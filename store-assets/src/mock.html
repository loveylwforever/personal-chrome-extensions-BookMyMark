<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BookMyMark Store Mock</title>
  <style>
    :root {
      --background: oklch(0.965 0.012 92);
      --foreground: oklch(0.24 0.012 85);
      --card-solid: oklch(0.985 0.01 92);
      --muted: oklch(0.94 0.012 90 / 0.72);
      --muted-foreground: oklch(0.48 0.012 85);
      --border: oklch(0.4 0.01 85 / 0.12);
      --border-soft: oklch(0.4 0.01 85 / 0.08);
      --primary: oklch(0.28 0.01 85);
      --danger: oklch(0.52 0.14 25);
      --radius: 0.65rem;
      --glass: oklch(0.99 0.01 92 / 0.78);
      --glass-muted: oklch(0.96 0.012 92 / 0.7);
      --glass-overlay: oklch(0.985 0.01 92);
      --shadow-soft: 0 1px 2px oklch(0.35 0.02 85 / 0.04), 0 8px 24px oklch(0.35 0.02 85 / 0.06);
      --shadow-float: 0 1px 2px oklch(0.35 0.02 85 / 0.05), 0 12px 32px oklch(0.35 0.02 85 / 0.08);
      --ambient-1: oklch(0.92 0.02 88 / 0.55);
      --ambient-2: oklch(0.94 0.015 95 / 0.45);
      --nav-ease: cubic-bezier(0.22, 1, 0.36, 1);
    }
    [data-theme="dark"] {
      --background: oklch(0.2 0.008 85);
      --foreground: oklch(0.93 0.006 90);
      --card-solid: oklch(0.25 0.008 85);
      --muted: oklch(0.3 0.008 85 / 0.55);
      --muted-foreground: oklch(0.72 0.008 90);
      --border: oklch(1 0 0 / 0.11);
      --border-soft: oklch(1 0 0 / 0.07);
      --primary: oklch(0.9 0.006 90);
      --danger: oklch(0.68 0.12 25);
      --glass: oklch(0.28 0.008 85 / 0.75);
      --glass-muted: oklch(0.24 0.008 85 / 0.65);
      --glass-overlay: oklch(0.26 0.008 85);
      --shadow-soft: 0 1px 2px oklch(0 0 0 / 0.16), 0 8px 28px oklch(0 0 0 / 0.18);
      --shadow-float: 0 1px 2px oklch(0 0 0 / 0.18), 0 16px 40px oklch(0 0 0 / 0.22);
      --ambient-1: oklch(0.3 0.012 90 / 0.45);
      --ambient-2: oklch(0.28 0.01 85 / 0.4);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%;
      font-family: "SF Pro Text", "Segoe UI", "PingFang SC", "Hiragino Sans GB", system-ui, sans-serif;
      color: var(--foreground);
      background: var(--background);
    }
    body {
      background:
        radial-gradient(1200px 600px at 12% -10%, var(--ambient-1), transparent 60%),
        radial-gradient(900px 500px at 95% 10%, var(--ambient-2), transparent 55%),
        var(--background);
    }
    .stage {
      width: 1280px; height: 800px; overflow: hidden;
      display: flex; flex-direction: column;
      position: relative;
    }
    .stage.marquee { width: 1400px; height: 560px; }

    /* Caption ribbon for feature emphasis */
    .caption {
      position: absolute; z-index: 40;
      left: 28px; bottom: 24px;
      max-width: 52%;
      padding: 14px 18px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: color-mix(in oklab, var(--glass-overlay) 92%, transparent);
      box-shadow: var(--shadow-float);
      backdrop-filter: blur(16px);
    }
    .caption h2 {
      margin: 0 0 4px; font-size: 18px; font-weight: 700; letter-spacing: -0.02em;
    }
    .caption p {
      margin: 0; font-size: 13px; line-height: 1.45; color: var(--muted-foreground);
    }
    .badge {
      display: inline-flex; align-items: center; gap: 6px;
      margin-bottom: 8px; padding: 3px 9px; border-radius: 999px;
      font-size: 11px; font-weight: 650;
      background: color-mix(in oklab, var(--primary) 12%, transparent);
      color: var(--primary);
    }

    .toolbar {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 18px; border-bottom: 1px solid var(--border);
      background: var(--glass); backdrop-filter: blur(18px);
    }
    .brand { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .logo {
      width: 28px; height: 28px; border-radius: 8px;
      background: #1a1a1a; color: #f3efe6;
      display: grid; place-items: center; font-size: 7px; font-weight: 700; line-height: 1.05;
      letter-spacing: 0.02em; text-align: center;
    }
    .title { font-size: 14px; font-weight: 650; letter-spacing: -0.02em; }
    .coffee { color: #c47a3a; font-size: 14px; }
    .search {
      margin-left: auto; display: flex; align-items: center; gap: 8px;
      width: 220px; height: 30px; padding: 0 10px 0 12px;
      border: 1px solid var(--border); border-radius: 8px; background: var(--glass-muted);
      color: var(--muted-foreground); font-size: 12px;
      white-space: nowrap; overflow: hidden; flex-shrink: 1; min-width: 0;
    }
    .btn {
      height: 30px; padding: 0 10px; border-radius: 8px; border: 1px solid transparent;
      background: transparent; color: var(--muted-foreground); font-size: 12px; font-weight: 500;
      display: inline-flex; align-items: center; gap: 5px; white-space: nowrap;
    }
    .btn.primary {
      border-color: color-mix(in oklab, var(--primary) 28%, transparent);
      background: color-mix(in oklab, var(--primary) 14%, transparent);
      color: var(--primary);
    }
    .btn.muted { background: var(--muted); border-color: var(--border-soft); }

    .body { flex: 1; min-height: 0; display: flex; }
    .sidebar {
      width: 240px; flex-shrink: 0; padding: 12px 8px 12px 12px;
      border-right: 1px solid var(--border); background: var(--glass-muted);
      display: flex; flex-direction: column; gap: 4px;
    }
    .side-h {
      display: flex; align-items: center; justify-content: space-between;
      padding: 4px 6px 10px; font-size: 12px; font-weight: 600; color: var(--muted-foreground);
    }
    .folder {
      display: flex; align-items: center; gap: 8px;
      padding: 7px 8px; border-radius: 8px; font-size: 13px;
    }
    .folder.active {
      background: color-mix(in oklab, var(--primary) 12%, transparent);
      color: var(--primary); font-weight: 600;
    }
    .folder .count {
      margin-left: auto; font-size: 11px; color: var(--muted-foreground);
      background: var(--muted); padding: 1px 6px; border-radius: 999px;
    }
    .indent { padding-left: 22px; }
    .ico { width: 14px; opacity: 0.7; }

    .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .main-h {
      display: flex; align-items: center; gap: 10px;
      padding: 12px 18px 8px;
    }
    .main-title { font-size: 16px; font-weight: 650; letter-spacing: -0.02em; }
    .tabs { display: flex; gap: 6px; padding: 0 18px 10px; }
    .tab {
      height: 28px; padding: 0 12px; border-radius: 8px; border: 1px solid transparent;
      font-size: 12px; color: var(--muted-foreground); display: inline-flex; align-items: center;
    }
    .tab.active {
      background: var(--muted); color: var(--foreground); font-weight: 600; border-color: var(--border-soft);
    }
    .grid {
      flex: 1; overflow: hidden; padding: 4px 18px 18px;
      display: grid; gap: 8px; align-content: start;
    }
    .grid.compact { grid-template-columns: repeat(4, 1fr); }
    .grid.list { grid-template-columns: 1fr; }
    .grid.expanded { grid-template-columns: repeat(3, 1fr); gap: 12px; }

    .card {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 12px; border-radius: 10px;
      border: 1px solid var(--border); background: var(--card-solid);
      box-shadow: var(--shadow-soft); position: relative;
    }
    .card.drop-after::after {
      content: ""; position: absolute; right: -2px; top: 8px; bottom: 8px; width: 2px;
      background: var(--primary); border-radius: 1px;
      box-shadow: 0 0 0 1px color-mix(in oklab, var(--primary) 35%, transparent);
    }
    .card.expanded-card {
      flex-direction: column; align-items: stretch; gap: 10px; min-height: 120px;
    }
    .fav {
      width: 28px; height: 28px; border-radius: 8px; flex-shrink: 0;
      display: grid; place-items: center; font-size: 12px; font-weight: 700;
      color: #fff;
    }
    .meta { min-width: 0; flex: 1; }
    .name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .url { font-size: 11px; color: var(--muted-foreground); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .star { color: #b0893d; font-size: 12px; }

    .rail {
      margin: 0 18px 12px; padding: 10px 12px; border-radius: 10px;
      border: 1px solid var(--border); background: var(--glass);
      display: flex; align-items: center; gap: 10px; font-size: 12px;
      box-shadow: var(--shadow-soft);
    }
    .pill {
      padding: 3px 8px; border-radius: 999px; font-weight: 650; font-size: 11px;
      background: color-mix(in oklab, var(--primary) 14%, transparent); color: var(--primary);
    }
    .arrange-head {
      display: flex; align-items: center; gap: 8px; padding: 4px 2px; margin-top: 4px;
    }
    .tag {
      font-size: 11px; font-weight: 650; padding: 2px 7px; border-radius: 5px;
      border: 1px solid var(--border-soft); background: var(--muted); color: var(--muted-foreground);
    }

    /* Marquee hero */
    .hero {
      width: 100%; height: 100%; display: grid;
      grid-template-columns: 1.05fr 1fr; gap: 28px;
      padding: 40px 48px; align-items: center;
    }
    .hero-copy h1 {
      margin: 0 0 12px; font-size: 42px; line-height: 1.1;
      font-weight: 750; letter-spacing: -0.03em;
    }
    .hero-copy .sub {
      margin: 0 0 22px; font-size: 16px; line-height: 1.5; color: var(--muted-foreground); max-width: 28em;
    }
    .hero-points { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip {
      padding: 7px 12px; border-radius: 999px; font-size: 12px; font-weight: 600;
      border: 1px solid var(--border); background: var(--card-solid); box-shadow: var(--shadow-soft);
    }
    .hero-ui {
      border-radius: 18px; border: 1px solid var(--border);
      background: var(--glass-overlay); box-shadow: var(--shadow-float);
      overflow: hidden; height: 420px; display: flex; flex-direction: column;
      transform: perspective(1200px) rotateY(-6deg) rotateX(2deg);
    }
    .hero-ui .toolbar { padding: 8px 10px; gap: 6px; flex-wrap: nowrap; }
    .hero-ui .title { display: none; }
    .hero-ui .search {
      width: 118px; flex: 0 0 118px; font-size: 11px; height: 26px; padding: 0 8px;
    }
    .hero-ui .btn { height: 26px; padding: 0 7px; font-size: 11px; flex-shrink: 0; }
    .hero-ui .btn.hide-sm { display: none; }
    .hero-ui .sidebar { width: 160px; }
    .hero-ui .grid.compact { grid-template-columns: repeat(2, 1fr); padding: 8px; gap: 6px; }
    .hero-ui .card { padding: 8px; }
    .hero-ui .name { font-size: 12px; }
    .hero-ui .url { font-size: 10px; }

    .home-stage {
      position: relative;
      flex: 1;
      min-height: 0;
      margin: 12px 14px 14px;
      padding: 14px 16px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-radius: 16px;
      border: 1px solid color-mix(in oklab, var(--border) 85%, var(--foreground));
      background:
        linear-gradient(
          155deg,
          color-mix(in oklab, var(--primary) 8%, var(--glass-muted)) 0%,
          var(--glass-muted) 42%,
          color-mix(in oklab, var(--ambient-2) 55%, var(--glass-muted)) 100%
        );
      overflow: hidden;
    }
    .home-top {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 220px;
      gap: 12px;
      flex: 0 0 auto;
    }
    .panel {
      border-radius: 14px;
      border: 1px solid color-mix(in oklab, var(--border) 80%, transparent);
      background: color-mix(in oklab, var(--card-solid) 78%, transparent);
    }
    .panel-h {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }
    .panel-h strong { font-size: 13px; letter-spacing: -0.01em; }
    .todos { padding: 12px 12px 10px; }
    .todo {
      display: flex;
      align-items: center;
      gap: 8px;
      height: 34px;
      padding: 0 4px;
      font-size: 12px;
    }
    .todo + .todo { border-top: 1px solid var(--border-soft); }
    .check {
      width: 14px; height: 14px; border-radius: 4px; flex-shrink: 0;
      border: 1.5px solid color-mix(in oklab, var(--foreground) 35%, transparent);
    }
    .check.on {
      background: #5b8c5a; border-color: #5b8c5a;
      color: #fff; font-size: 10px; display: grid; place-items: center;
    }
    .swatch { width: 8px; height: 18px; border-radius: 99px; flex-shrink: 0; }
    .todo-name { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .todo.done .todo-name { color: var(--muted-foreground); text-decoration: line-through; }
    .dur {
      font-variant-numeric: tabular-nums;
      color: var(--muted-foreground);
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 6px;
      background: var(--glass-muted);
    }
    .when { width: 92px; font-size: 11px; color: var(--muted-foreground); font-variant-numeric: tabular-nums; }
    .st {
      font-size: 10px; font-weight: 650; padding: 2px 6px; border-radius: 999px;
    }
    .st.go { color: #8a4a32; background: color-mix(in oklab, #c45c3a 16%, transparent); }
    .st.late { color: #8a3a32; background: color-mix(in oklab, #c45c3a 22%, transparent); }
    .pomo { padding: 14px 14px 12px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .phases { display: flex; gap: 4px; width: 100%; }
    .phases span {
      flex: 1; text-align: center; font-size: 11px; padding: 4px 0; border-radius: 7px;
      color: var(--muted-foreground); background: var(--glass-muted);
    }
    .phases span.on {
      color: var(--foreground); font-weight: 650;
      background: color-mix(in oklab, #c45c3a 16%, var(--card-solid));
    }
    .ring { position: relative; width: 108px; height: 108px; }
    .ring svg { width: 108px; height: 108px; }
    .ring-label {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 1px;
    }
    .ring-label b { font-size: 20px; font-variant-numeric: tabular-nums; letter-spacing: -0.03em; }
    .ring-label span { font-size: 11px; color: var(--muted-foreground); }
    .pomo-actions { display: flex; gap: 6px; width: 100%; }
    .pomo-actions .btn { flex: 1; justify-content: center; height: 28px; }
    .gantt { flex: 1; min-height: 0; padding: 12px 12px 10px; display: flex; flex-direction: column; }
    .gantt-grid { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 0; margin-top: 4px; }
    .gantt-row {
      display: grid;
      grid-template-columns: 108px repeat(15, 1fr);
      align-items: center;
      min-height: 26px;
    }
    .gantt-row.days { min-height: 32px; }
    .gantt-name { font-size: 11px; color: var(--muted-foreground); padding-right: 6px; white-space: nowrap; overflow: hidden; }
    .day {
      text-align: center; font-size: 10px; color: var(--muted-foreground); line-height: 1.15;
    }
    .day b { display: block; font-size: 11px; font-weight: 650; color: var(--foreground); }
    .day.today b {
      width: 18px; height: 18px; margin: 0 auto; border-radius: 99px;
      display: grid; place-items: center;
      background: #c45c3a; color: #fff;
    }
    .lane { position: relative; height: 22px; grid-column: 2 / -1; }
    .bar {
      position: absolute; top: 4px; height: 14px; border-radius: 4px;
    }
    .bar i {
      display: block; height: 100%; width: 62%;
      background: color-mix(in oklab, #000 18%, transparent); border-radius: 4px 0 0 4px;
    }
    .bar.done { opacity: 0.45; }
    .pet {
      position: absolute; right: 8px; bottom: 6px; width: 108px; z-index: 3;
      filter: drop-shadow(0 8px 10px oklch(0.35 0.02 85 / 0.16));
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
    const DEMO = {
      folders: [
        { name: '全部目录', count: 128, active: false, globe: true },
        { name: '工作流', count: 36, active: true, emoji: '🗂️' },
        { name: '设计灵感', count: 24, active: false, emoji: '✨', indent: true },
        { name: '工程笔记', count: 18, active: false, emoji: '🧩', indent: true },
        { name: '学习清单', count: 41, active: false, emoji: '📚' },
        { name: '周末灵感', count: 23, active: false, emoji: '🌿' },
      ],
      sites: [
        { t: 'Figma Community', u: 'figma.com/community', c: '#0acf83', letter: 'F', star: true },
        { t: 'MDN Web Docs', u: 'developer.mozilla.org', c: '#1b1b1b', letter: 'M' },
        { t: 'Linear Method', u: 'linear.app/method', c: '#5e6ad2', letter: 'L', star: true },
        { t: 'CSS Tricks', u: 'css-tricks.com', c: '#ff7a18', letter: 'C' },
        { t: 'Arc Browser Tips', u: 'resources.arc.net', c: '#111', letter: 'A' },
        { t: 'Vite Guide', u: 'vitejs.dev/guide', c: '#646cff', letter: 'V' },
        { t: 'Notion Templates', u: 'notion.so/templates', c: '#37352f', letter: 'N' },
        { t: 'Dribbble Shots', u: 'dribbble.com/shots', c: '#ea4c89', letter: 'D', star: true },
        { t: 'GitHub Explore', u: 'github.com/explore', c: '#24292f', letter: 'G' },
        { t: 'TypeScript Handbook', u: 'typescriptlang.org/docs', c: '#3178c6', letter: 'T' },
        { t: 'Raycast Store', u: 'raycast.com/store', c: '#ff6363', letter: 'R' },
        { t: 'Coolors Palette', u: 'coolors.co', c: '#15aabf', letter: 'C' },
      ],
    };

    const SCENES = {
      overview: {
        theme: 'light',
        caption: { badge: '新标签页书签中心', title: '把杂乱收藏夹，变成可浏览的导航', desc: '侧栏目录 · 智能标签 · 多视图卡片，一眼找到想去的网站。' },
        view: 'compact',
      },
      search: {
        theme: 'light',
        caption: { badge: '即时搜索', title: '输入即搜，目录与标题一起匹配', desc: '不用翻层层文件夹，几秒定位到目标站点。' },
        view: 'list',
        search: 'design system',
        filter: (s) => /figma|dribbble|css|notion|coolors/i.test(s.t + s.u),
      },
      magic: {
        theme: 'light',
        caption: { badge: '魔法工具', title: '按域名整理 · 探活 · 一键去重', desc: '把同站散落书签收拢分组，顺手清掉失效链接。' },
        view: 'compact',
        arrange: true,
      },
      dark: {
        theme: 'dark',
        caption: { badge: '浅色 / 深色', title: '护眼玻璃质感，日夜都好看', desc: '跟随系统或手动切换，界面始终清爽不刺眼。' },
        view: 'expanded',
      },
      i18n: {
        theme: 'light',
        caption: { badge: '多语言', title: '中 / EN / 日 / 韩… 一键切换', desc: '界面文案极简适配，布局不跟着语言跑偏。' },
        view: 'compact',
        lang: 'English',
      },
      home: {
        theme: 'light',
        home: true,
        caption: {
          badge: '首页',
          title: '待办、甘特和番茄钟，打开新标签就能开始',
          desc: '时长按 15 分钟一档，番茄钟在所有书签页一起走。',
        },
      },
      marquee: { theme: 'light', marquee: true },
    };

    function logo() {
      return `<div class="logo">o o<br/>bkmk</div>`;
    }

    function toolbar(scene) {
      const q = scene.search || '搜索网站…';
      const lang = scene.lang || '中文';
      return `
        <div class="toolbar">
          <div class="brand">${logo()}<span class="title">BookMyMark</span><span class="coffee">☕</span></div>
          <div class="search">⌕ &nbsp;${q}</div>
          <div class="btn muted">${lang}</div>
          <div class="btn">◐</div>
          <div class="btn muted">魔法 ▾</div>
          <div class="btn hide-sm">导入</div>
          <div class="btn hide-sm">导出</div>
          <div class="btn primary">＋ 添加</div>
        </div>`;
    }

    function sidebar(home) {
      const homeRow = home
        ? `<div class="folder active"><span class="ico">⌂</span><span>首页</span></div>`
        : '';
      return `<aside class="sidebar">
        <div class="side-h"><span>目录</span><span>＋</span></div>
        ${homeRow}
        ${DEMO.folders.map(f => `
          <div class="folder ${!home && f.active ? 'active' : ''} ${f.indent ? 'indent' : ''}">
            <span class="ico">${f.globe ? '🌐' : (f.emoji || '📁')}</span>
            <span>${f.name}</span>
            <span class="count">${f.count}</span>
          </div>`).join('')}
      </aside>`;
    }

    function card(s, view, extra = '') {
      if (view === 'expanded') {
        return `<div class="card expanded-card ${extra}">
          <div style="display:flex;gap:10px;align-items:center">
            <div class="fav" style="background:${s.c};width:40px;height:40px;font-size:16px">${s.letter}</div>
            <div class="meta"><div class="name">${s.t}</div><div class="url">${s.u}</div></div>
            ${s.star ? '<span class="star">★</span>' : ''}
          </div>
          <div style="font-size:12px;color:var(--muted-foreground);line-height:1.4">精选资源 · 演示数据</div>
          <div style="display:flex;gap:8px;font-size:11px;color:var(--muted-foreground)"><span>访问 12</span><span>·</span><span>工作流 / 设计灵感</span></div>
        </div>`;
      }
      return `<div class="card ${extra}">
        <div class="fav" style="background:${s.c}">${s.letter}</div>
        <div class="meta"><div class="name">${s.t}</div><div class="url">${s.u}</div></div>
        ${s.star ? '<span class="star">★</span>' : ''}
      </div>`;
    }

    function main(scene) {
      let sites = DEMO.sites;
      if (scene.filter) sites = sites.filter(scene.filter);
      const view = scene.view || 'compact';
      let body = '';
      if (scene.arrange) {
        body = `
          <div class="rail"><span class="pill">整理 · 域名</span><span>3 组 · 12 站</span><span style="margin-left:auto" class="btn muted">退出</span></div>
          <div style="padding:0 18px;display:flex;flex-direction:column;gap:10px;overflow:hidden">
            <div>
              <div class="arrange-head"><span class="tag">域名</span><strong style="font-size:14px">github.com</strong><span style="margin-left:auto;font-size:12px;color:var(--muted-foreground)">4</span></div>
              <div class="grid compact" style="padding:6px 0;grid-template-columns:repeat(4,1fr)">${sites.slice(0,4).map(s => card(s, 'compact')).join('')}</div>
            </div>
            <div>
              <div class="arrange-head"><span class="tag">域名</span><strong style="font-size:14px">figma.com</strong><span style="margin-left:auto;font-size:12px;color:var(--muted-foreground)">3</span></div>
              <div class="grid compact" style="padding:6px 0;grid-template-columns:repeat(4,1fr)">${sites.slice(4,8).map((s,i) => card(s, 'compact', i===2?'drop-after':'')).join('')}</div>
            </div>
          </div>`;
      } else {
        body = `<div class="grid ${view}">${sites.map((s,i) => card(s, view, scene.search && i===0 ? 'drop-after' : '')).join('')}</div>`;
      }
      return `<main class="main">
        <div class="main-h">
          <div class="main-title">工作流</div>
          <div class="btn muted" style="margin-left:auto">批量操作</div>
          <div class="btn muted">排序方式：默认 ▾</div>
          <div class="btn muted">▦ ▤ ☰</div>
        </div>
        <div class="tabs">
          <div class="tab active">全部</div>
          <div class="tab">我的收藏</div>
          <div class="tab">最常访问</div>
          <div class="tab">最近访问</div>
        </div>
        ${body}
      </main>`;
    }

    function homeMain() {
      const days = [];
      for (let d = 10; d <= 24; d++) {
        const week = '日一二三四五六'[(new Date(2026, 8, d)).getDay()];
        days.push(`<div class="day ${d === 19 ? 'today' : ''}"><b>${d}</b>${week}</div>`);
      }
      const todos = [
        { name: '写商店说明', color: '#C45C3A', dur: '45 分钟', when: '09-19 09:00', st: '<span class="st go">进行中</span>' },
        { name: '整理书签目录', color: '#3D7EA6', dur: '1 小时', when: '09-19 14:00', st: '' },
        { name: '补首页截图', color: '#C47A3A', dur: '30 分钟', when: '09-18 16:00', st: '<span class="st late">已超时</span>' },
        { name: '复习本周笔记', color: '#5B8C5A', dur: '25 分钟', when: '09-17 20:00', st: '', done: true },
      ];
      return `<main class="main">
        <div class="home-stage">
          <div class="home-top">
            <section class="panel todos">
              <div class="panel-h"><strong>待办清单</strong><span class="btn primary">＋ 添加</span></div>
              ${todos.map((t) => `
                <div class="todo ${t.done ? 'done' : ''}">
                  <span class="check ${t.done ? 'on' : ''}">${t.done ? '✓' : ''}</span>
                  <span class="swatch" style="background:${t.color}"></span>
                  <span class="todo-name">${t.name}</span>
                  <span class="dur">${t.dur}</span>
                  <span class="when">${t.when}</span>
                  ${t.st}
                </div>`).join('')}
            </section>
            <aside class="panel pomo">
              <div class="panel-h" style="width:100%"><strong>番茄钟</strong><span style="font-size:11px;color:var(--muted-foreground)">音效开</span></div>
              <div class="phases"><span class="on">专注</span><span>短休</span><span>长休</span></div>
              <div class="ring">
                <svg viewBox="0 0 80 80" aria-hidden="true">
                  <circle cx="40" cy="40" r="32" fill="none" stroke="oklch(0.4 0.01 85 / 0.12)" stroke-width="6"/>
                  <circle cx="40" cy="40" r="32" fill="none" stroke="#C45C3A" stroke-width="6" stroke-linecap="round"
                    stroke-dasharray="148 201" transform="rotate(-90 40 40)"/>
                </svg>
                <div class="ring-label"><b>18:24</b><span>专注</span></div>
              </div>
              <div class="pomo-actions">
                <span class="btn primary">暂停</span>
                <span class="btn muted">跳过</span>
              </div>
            </aside>
          </div>
          <section class="panel gantt">
            <div class="panel-h">
              <strong>待办甘特</strong>
              <span class="btn muted">导出</span>
            </div>
            <div class="gantt-grid">
              <div class="gantt-row days"><div></div>${days.join('')}</div>
              <div class="gantt-row"><div class="gantt-name">写商店说明</div><div class="lane"><div class="bar" style="left:60%;width:6.7%;background:#C45C3A"><i></i></div></div></div>
              <div class="gantt-row"><div class="gantt-name">整理书签目录</div><div class="lane"><div class="bar" style="left:60%;width:13.4%;background:#3D7EA6"></div></div></div>
              <div class="gantt-row"><div class="gantt-name">补首页截图</div><div class="lane"><div class="bar" style="left:53.3%;width:6.7%;background:#C47A3A"></div></div></div>
              <div class="gantt-row"><div class="gantt-name">复习本周笔记</div><div class="lane"><div class="bar done" style="left:46.6%;width:6.7%;background:#5B8C5A"></div></div></div>
            </div>
          </section>
          <svg class="pet" viewBox="0 0 128 128" aria-hidden="true">
            <ellipse cx="64" cy="112" rx="28" ry="5" fill="#C4A882" opacity="0.28"/>
            <path d="M42 44c-8.5-4.5-12-16-5.5-24 4.5-6 13-4.5 14.5 3 1.5 6.5-1 15.5-9 21z" fill="#F7EEE2" stroke="#D9C4A8" stroke-width="1.4"/>
            <path d="M86 44c8.5-4.5 12-16 5.5-24-4.5-6-13-4.5-14.5 3-1.5 6.5 1 15.5 9 21z" fill="#F7EEE2" stroke="#D9C4A8" stroke-width="1.4"/>
            <path d="M30 86c0-26 14-48 34-48s34 22 34 48c0 8-6 14-14 14H44c-8 0-14-6-14-14z" fill="#FFFCF7" stroke="#D9C4A8" stroke-width="1.8"/>
            <circle cx="46" cy="74" r="5" fill="#F0A8B4" opacity="0.55"/>
            <circle cx="82" cy="74" r="5" fill="#F0A8B4" opacity="0.55"/>
            <ellipse cx="52" cy="66" rx="4.6" ry="5.4" fill="#2A2420"/>
            <ellipse cx="76" cy="66" rx="4.6" ry="5.4" fill="#2A2420"/>
            <circle cx="53.4" cy="64.4" r="1.3" fill="#fff"/>
            <circle cx="77.4" cy="64.4" r="1.3" fill="#fff"/>
            <path d="M58 78c2.4 2.8 9.2 2.8 12 0" stroke="#2A2420" stroke-width="2" stroke-linecap="round" fill="none"/>
            <path d="M58 92h12v14l-6-3.6L58 106V92z" fill="#C45C3A"/>
          </svg>
        </div>
      </main>`;
    }

    function caption(c) {
      if (!c) return '';
      return `<div class="caption"><div class="badge">${c.badge}</div><h2>${c.title}</h2><p>${c.desc}</p></div>`;
    }

    function renderMarquee() {
      document.documentElement.dataset.theme = 'light';
      document.getElementById('root').innerHTML = `
        <div class="stage marquee">
          <div class="hero">
            <div class="hero-copy">
              <div class="brand" style="margin-bottom:18px">${logo()}<span class="title" style="font-size:18px">BookMyMark</span></div>
              <h1>更优雅的<br/>Chrome 书签管理</h1>
              <p class="sub">新标签页一站式整理收藏：目录树、搜索、魔法整理与探活，多语言与深浅色主题齐全。</p>
              <div class="hero-points">
                <span class="chip">目录树拖拽</span>
                <span class="chip">按域名整理</span>
                <span class="chip">失效链接探活</span>
                <span class="chip">7 种语言</span>
              </div>
            </div>
            <div class="hero-ui">
              ${toolbar({})}
              <div class="body" style="min-height:0">
                ${sidebar()}
                <div class="main">
                  <div class="main-h"><div class="main-title">工作流</div></div>
                  <div class="grid compact">
                    ${DEMO.sites.slice(0,6).map(s => card(s, 'compact')).join('')}
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>`;
    }

    function render(name) {
      const scene = SCENES[name];
      if (!scene) return;
      if (scene.marquee) return renderMarquee();
      document.documentElement.dataset.theme = scene.theme;
      document.getElementById('root').innerHTML = `
        <div class="stage">
          ${toolbar(scene)}
          <div class="body">${sidebar(scene.home)}${scene.home ? homeMain() : main(scene)}</div>
          ${caption(scene.caption)}
        </div>`;
    }

    const params = new URLSearchParams(location.search);
    render(params.get('scene') || 'overview');
  </script>
</body>
</html>
